<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07070a">
<title>Table Jai Alai</title>
<style>html,body{margin:0;height:100%;background:#07070a;overflow:hidden;overscroll-behavior:none}canvas{display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}</style>
</head>
<body>
<canvas id="tableCv"></canvas>
<script>
window.FL_LOOK2 = 1;
/* ---------- Jai alai rules + physics (no DOM) ---------- */
var Core = (function () {
  'use strict';
  var C = {
    W: 2000, H: 895,
    BACK: 132, FRONT: 1878,          // back wall (rebote) and front wall (frontis)
    FLOORY: 758, FEET: 774,           // ball bounce height, player feet
    TOP: 384, CHAPA: 726, CEIL: 92,   // legal front-wall band, ceiling
    R: 12, GRAV: 1000, V: 1750, VSERVE: 1500, VHARD: 2600,   // VHARD: a power throw that carries to the back wall
    E_FRONT: 0.8, E_BACK: 0.55, E_FLOOR: 0.5, F_FLOOR: 0.93,
    // x position of court lines 1..14 on the side wall (line 1 is nearest the front wall)
    LINES: [0, 1776, 1652, 1534, 1424, 1298, 1185, 1055, 936, 811, 679, 541, 434, 311, 189],
    SPEED: 320, AMIN: -6, AMAX: 38, SMIN: 16, SMAX: 34,
    PMIN: 172, PMAX: 1812, REACH_H: 90, REACH_C: 64,
    PASS_W: 86, PASS_H: 190, JUMP_UP: 80, LEAP_UP: 55,
    LAT_V: 0.85, LAT_R: 0.2           // across the court (0 = side wall, 1 = open side): how fast a player shuffles sideways, and how far to either side he can take a ball           // a person's catch zone: this far either side, and this high above the floor
  };
  /* one standard court for every view: evenly spaced lines, the low red line, and the wall good all the way up to its gold line.
     Only the height of that gold line differs, because it sits at a different height in each picture. */
  function setCourt(modern) {
    for (var ln = 1; ln <= 14; ln++) C.LINES[ln] = Math.round(1820 - (ln - 1) * 124.77);
    C.TOP = modern ? 300 : 362; C.CHAPA = 741;
    C.ZONE_NEAR = C.LINES[4];   // serve must land between line 4 ...
    C.ZONE_FAR = C.LINES[7];    // ... and line 7
  }
  setCourt(typeof window !== 'undefined' && !!window.FL_LOOK2);

  var LV = {
    easy:   { noise: 6.0, pick: 0,    react: 0.60, err: 70, speed: 0.85 },
    normal: { noise: 4.2, pick: 0.6,  react: 0.42, err: 48, speed: 0.93 },
    hard:   { noise: 2.6, pick: 0.25, react: 0.24, err: 26, speed: 1.0 }
  };
  var FAULTS = { ceiling: 1, over: 1, under: 1, short: 1, serveOut: 1, backOver: 1, held: 1 };
  C.REBOTE_HOLD = 2;   // seconds a person may hold a ball taken off the back wall

  function gauss() { return (Math.random() + Math.random() + Math.random() + Math.random() - 2) * 0.87; }
  function tri(x) { x = x - Math.floor(x); return x < 0.5 ? x * 2 : 2 - 2 * x; }

  /* one physics step for a ball in play; returns an event name or null */
  function advance(b, f, h) {
    b.vy += C.GRAV * h; b.x += b.vx * h; b.y += b.vy * h;
    if (b.y < C.CEIL) return 'ceiling';
    // dos paredes and costado take the side wall on the way to the front wall; the cortada takes it coming back
    if ((f.shot === 3 || f.shot === 4) && !f.side && !f.hitFront && b.vx > 0 && b.x >= f.sideX) { f.side = true; b.vx *= 0.94; b.vy -= f.shot === 4 ? 90 : 130; return 'side'; }   // the side wall first, then the front wall
    if (f.shot === 2 && f.hitFront && !f.side && b.vx < 0 && b.x <= f.sideX) { f.side = true; b.vx *= 0.88; b.vy += 90; return 'side'; }      // cortada: off the front wall, then it tails hard into the side wall
    if (b.x >= C.FRONT - C.R && b.vx > 0) {
      b.x = C.FRONT - C.R;
      if (!f.hitFront) {
        if (b.y < C.TOP) return 'over';
        if (b.y > C.CHAPA) return 'under';
        f.hitFront = true;
        if (f.shot === 2) { b.vx = -b.vx * 0.58; b.vy = Math.max(b.vy, 0) * 0.5 + 190; }       // cortada: low and hard off the middle of the front wall, still carrying
        else if (f.shot === 3) { b.vx = -b.vx * 0.6; b.vy = b.vy * 0.6 + 120; }                 // dos paredes: comes off dead and drops short, angling away across the court
        else if (f.shot === 4) { b.vx = -b.vx * 0.9; b.vy = b.vy * 0.92 - 180; }                // costado: kicks off the wall and carries deep
        else { b.vx = -b.vx * C.E_FRONT; b.vy *= 0.92; }
        return 'front';
      }
      b.vx = -b.vx * C.E_FRONT; return 'wall';
    }
    if (b.x <= C.BACK + C.R && b.vx < 0) {
      b.x = C.BACK + C.R;
      if (b.y < C.TOP) return 'backOver';                      // above the playing area on the back wall: out, same as the front wall
      b.vx = -b.vx * C.E_BACK; f.back = true;
      if (f.cc) { f.cc = false; b.vy *= 0.6; b.vx *= 0.8; return 'chicchac'; }   // floor then back wall in one beat: it comes off dead and fast
      return 'back';
    }
    if (b.y >= C.FLOORY && b.vy > 0) {
      b.y = C.FLOORY;
      if (!f.hitFront) return 'short';
      f.bounces++;
      if (f.serve && f.bounces === 1 && (b.x < C.ZONE_FAR || b.x > C.ZONE_NEAR)) return 'serveOut';
      if (f.bounces >= 2) return 'double';
      if (b.vx < 0 && !f.back) {
        if (b.x <= C.BACK + C.R + 30) return 'chula';              // into the seam of floor and back wall: it rolls out, no return possible
        if (b.x <= C.BACK + C.R + 170) f.cc = true;                // floor just before the back wall: chic-chac
      }
      if (f.shot === 4) { b.vy = -b.vy * 0.36; b.vx *= 0.86; }                                  // a costado skids low off the floor
      else if (f.shot === 3) { b.vy = -b.vy * 0.42; b.vx *= 0.7; }                              // a dos paredes sits down and dies
      else { b.vy = -b.vy * C.E_FLOOR; b.vx *= C.F_FLOOR; }
      return 'bounce';
    }
    return null;
  }

  /* dead ball after a point: just let it bounce around */
  function loose(b, h) {
    b.vy += C.GRAV * h; b.x += b.vx * h; b.y += b.vy * h;
    if (b.x > C.FRONT - C.R) { b.x = C.FRONT - C.R; b.vx = -Math.abs(b.vx) * 0.6; }
    if (b.x < C.BACK + C.R) { b.x = C.BACK + C.R; b.vx = Math.abs(b.vx) * 0.6; }
    if (b.y > C.FLOORY) { b.y = C.FLOORY; b.vy = -Math.abs(b.vy) * 0.55; b.vx *= 0.8; if (Math.abs(b.vy) < 60) b.vy = 0; }
    if (b.y < C.CEIL) { b.y = C.CEIL; b.vy = Math.abs(b.vy) * 0.4; }
  }

  function predict(b0, f0, untilBounce) {
    var b = { x: b0.x, y: b0.y, vx: b0.vx, vy: b0.vy };
    var f = { hitFront: f0.hitFront, bounces: f0.bounces, serve: f0.serve, shot: f0.shot | 0, side: !!f0.side, sideX: f0.sideX, back: !!f0.back, cc: !!f0.cc };
    var h = 1 / 120, t = 0, s = [], res = { s: s, end: null, endT: 0, frontY: null, bounceX: null, fault: false };
    while (t < 6) {
      var ev = advance(b, f, h); t += h;
      if (ev === 'front' || ev === 'over' || ev === 'under') res.frontY = b.y;
      if ((ev === 'bounce' || ev === 'double' || ev === 'serveOut' || ev === 'chula') && res.bounceX == null) res.bounceX = b.x;
      s.push({ t: t, x: b.x, y: b.y, n: f.bounces, c: f.hitFront && (!f.serve || f.bounces >= 1) });
      if (ev && (FAULTS[ev] || ev === 'double' || ev === 'chula')) { res.end = ev; res.endT = t; break; }
      if (untilBounce && ev === 'bounce') break;
    }
    res.fault = !!FAULTS[res.end];
    return res;
  }

  function hand(p) { return { x: p.x + 34, y: C.FEET - 128 }; }
  /* shots: 0 pelotazo, 1 rebota (carries to the back wall), 2 cortada (front wall, then tails into the side wall by line 3),
     3 dos paredes (side wall by line 3, then the front wall; dies short at a sharp angle), 4 costado (a backhand off the side wall up by line 2; comes back deep and low) */
  function shotOf(serve, s) { return serve ? 0 : (s === true ? 1 : (s | 0)); }
  function launch(p, deg, serve, shot) {
    shot = shotOf(serve, shot);
    var a = deg * Math.PI / 180, v = serve ? C.VSERVE : [C.V, C.VHARD, C.V * 1.04, C.V * 1.1, C.V * 1.06][shot] || C.V, hp = hand(p);
    return { x: hp.x, y: hp.y, vx: v * Math.cos(a), vy: -v * Math.sin(a) };
  }
  function flagsFor(p, serve, shot) {
    shot = shotOf(serve, shot);
    var hx = hand(p).x, sx = shot === 2 ? C.LINES[3] : Math.min(C.FRONT - 40, Math.max(hx + 40, shot === 4 ? C.LINES[2] : C.LINES[3]));   // the two-wall shot clips the side wall on the way up; the cortada tails into it coming back, by line 3
    return { hitFront: false, bounces: 0, serve: !!serve, shot: shot, side: false, sideX: sx, x0: hx };
  }
  function sweep(t, serve) {
    if (serve) return C.SMIN + (C.SMAX - C.SMIN) * tri(t * 0.42);
    return C.AMIN + (C.AMAX - C.AMIN) * tri(t * 0.8 + 0.2308);
  }

  function reachOf(p) { return p.human ? C.REACH_H : C.REACH_C; }
  function speedOf(g, p) { return C.SPEED * (p.human ? 1.12 : LV[g.cfg.level].speed) * (p.single ? 1.35 : 1); }   // alone on court, a player covers more ground
  function allow(y, reach) {
    var dy = Math.abs(y - (C.FEET - 95));
    return dy < reach ? Math.sqrt(reach * reach - dy * dy) * 0.75 : -1;
  }
  /* best time margin (s) a player has to get under the ball; negative = can't reach */
  function bestMargin(pr, q, tNow, speed, reach) {
    var best = -9, s = pr.s;
    for (var i = 0; i < s.length; i++) {
      var k = s[i]; if (!k.c || k.t <= tNow) continue;
      var al = allow(k.y, reach); if (al < 0) continue;
      var m = (k.t - tNow) - Math.max(0, Math.abs(k.x - q.x) - al) / speed;
      if (m > best) best = m;
    }
    return best;
  }

  function chooseAngle(g, p, serve) {
    var lv = LV[g.cfg.level], min = serve ? C.SMIN : C.AMIN, max = serve ? C.SMAX : C.AMAX, opts = [];
    var opp = g.players.filter(function (q) { return q.team !== p.team && !q.out; });
    var rnd = Math.random(), hard = !serve && rnd < 0.3;           // about three throws in ten are power throws off the back wall
    var shot = serve ? 0 : hard ? 1 : rnd < 0.38 ? 2 : rnd < 0.45 ? 3 : rnd < 0.53 ? 4 : 0;   // and now and then a cortada, dos paredes or costado
    for (var a = min; a <= max; a += 1) {
      var pr = predict(launch(p, a, serve, shot), flagsFor(p, serve, shot));
      var m = -9;
      if (!pr.fault) for (var j = 0; j < opp.length; j++) m = Math.max(m, bestMargin(pr, opp[j], 0, C.SPEED, C.REACH_C));
      var rb = false;                                              // does it come off the back wall on the fly, above head height?
      if (hard && !pr.fault) for (var k = 0; k < pr.s.length; k++) if (pr.s[k].x <= C.BACK + C.R + 1) { rb = pr.s[k].n === 0 && pr.s[k].y < C.FEET - 175; break; }
      opts.push({ a: a, ok: !pr.fault, m: m, rb: rb });
    }
    p.ai.hard = shot;
    var ok = function (i) { return opts[i] && opts[i].ok; };
    var val = opts.filter(function (o, i) { return ok(i) && ok(i - 1) && ok(i + 1) && ok(i - 2) && ok(i + 2); });
    if (!val.length) val = opts.filter(function (o, i) { return ok(i) && ok(i - 1) && ok(i + 1); });
    if (!val.length) val = opts.filter(function (o) { return o.ok; });
    if (!val.length) { p.ai.hard = 0; return 22; }
    if (hard) { var off = val.filter(function (o) { return o.rb; }); if (off.length) val = off; }
    var pick;
    if (!lv.pick) pick = val[Math.floor(Math.random() * val.length)];
    else {
      val.sort(function (x, y) { return x.m - y.m; });
      pick = val[Math.floor(Math.random() * Math.max(1, Math.ceil(val.length * lv.pick)))];
    }
    return pick.a + gauss() * lv.noise;
  }

  function newGame(cfg) {
    var g = {
      cfg: cfg, score: [0, 0], players: [], ball: { x: 0, y: 0, vx: 0, vy: 0, z: 0.5, vz: 0 }, lat: false,
      flags: { hitFront: false, bounces: 0, serve: true },
      phase: 'serve', holder: -1, lastTeam: 0, server: 0, t: 0, flightT: 0, pred: null,
      msg: null, msgT: 0, events: [], winner: -1, rally: 0, pointWinner: 0, act: [-1, -1], hc: [0, 0], hard: false
    };
    var solo = cfg.solo || [cfg.soloTeam === 0, cfg.soloTeam === 1]; cfg.solo = solo;   // solo[t]: one person runs both players of team t
    for (var i = 0; i < 4; i++) {
      g.players.push({ i: i, team: i >> 1, role: i % 2 ? 'B' : 'F', human: !!cfg.seats[i] || solo[i >> 1], x: 0, z: (i >> 1) ? 0.66 : 0.36, zh: (i >> 1) ? 0.66 : 0.36, face: 1, vx: 0,
        holdT: 0, cool: 0, anim: 0, run: 0, aim: 20, jump: 0, wall: false, ai: {},
        out: !!cfg.singles && i % 2 === 1, single: !!cfg.singles });   // singles: the back-court players sit out
    }
    setServe(g, cfg.firstServe || 0);
    return g;
  }

  function setServe(g, team) {
    var P = g.players, o = 1 - team;
    g.phase = 'serve'; g.server = team; g.lastTeam = team; g.rally = 0; g.pred = null;
    P[team * 2].x = C.LINES[10] - 14; P[team * 2 + 1].x = C.LINES[13];
    P[o * 2].x = g.cfg.singles ? C.LINES[7] : (C.LINES[5] + C.LINES[6]) / 2; P[o * 2 + 1].x = C.LINES[12] - 20;
    P.forEach(function (p) { p.holdT = 0; p.cool = 0; p.vx = 0; p.anim = 0; p.ai = {}; p.z = p.zh; });
    g.holder = team * 2;
    if (g.cfg.solo[0]) g.act[0] = 0;
    if (g.cfg.solo[1]) g.act[1] = 2;
    g.flags = { hitFront: false, bounces: 0, serve: true }; g.reb = false;
    var hp = hand(P[team * 2]); g.ball.x = hp.x; g.ball.y = hp.y; g.ball.vx = g.ball.vy = 0;
    plan(g, P[team * 2], true);
  }

  function plan(g, p, serve) {
    if (p.human) return;
    p.ai.angle = chooseAngle(g, p, serve);
    p.ai.hold = serve ? 1.15 : 0.24 + Math.random() * 0.2;
  }

  function home(p) { return p.single ? 820 : p.role === 'F' ? 1300 : 375; }   // back-court players wait deep, near lines 12 to 13
  function inZone(p, x) { return p.role === 'F' ? x >= 1000 : x <= 1120; }

  function intercept(g, p, zoneOnly) {
    var s = g.pred.s, sp = speedOf(g, p), reach = reachOf(p), tNow = g.flightT, best = null, bestShort = 1e9;
    for (var i = 0; i < s.length; i++) {
      var k = s[i]; if (!k.c || k.t <= tNow) continue;
      if (zoneOnly && !inZone(p, k.x)) continue;
      var al = allow(k.y, reach); if (al < 0) continue;
      var short = Math.max(0, Math.abs(k.x - p.x) - al) - sp * (k.t - tNow);
      if (short <= 0) return { x: k.x, t: k.t, ok: true, short: 0 };
      if (short < bestShort) { bestShort = short; best = { x: k.x, t: k.t, ok: false, short: short }; }
    }
    return best;
  }

  /* is this player being steered by a person right now? */
  function ctl(g, p) { return p.human && (!g.cfg.solo[p.team] || g.act[p.team] === p.i); }
  function coverDir(g, p) {
    if (g.phase !== 'rally') return 0;
    var dx = home(p) - p.x; return Math.abs(dx) < 9 ? 0 : (dx > 0 ? 1 : -1);
  }
  function chooseActive(g, team) {
    var best = g.act[team], bs = 1e9;
    for (var i = team * 2; i < team * 2 + 2; i++) {
      if (g.players[i].out) continue;
      var it = intercept(g, g.players[i], false), sc = !it ? 1e8 : (it.ok ? it.t : 100 + it.short);
      if (sc < bs - 0.0001) { bs = sc; best = i; }
    }
    return best;
  }

  function cpuDir(g, p) {
    if (g.phase !== 'rally') return 0;
    var target = home(p);
    if (g.holder < 0 && p.team !== g.lastTeam && g.pred && g.flightT >= (p.ai.react || 0)) {
      var mate = g.players[p.i ^ 1], mine = intercept(g, p, mate.human && !mate.out);
      if (mine) {
        var go = true;
        if (!mate.human && !mate.out) {
          var theirs = intercept(g, mate, false);
          if (theirs && theirs.ok && (!mine.ok || theirs.t < mine.t - 0.001 || (theirs.t <= mine.t + 0.001 && mate.i < p.i))) go = false;
        }
        if (go) target = mine.x + (p.ai.err || 0);
      }
    }
    var dx = target - p.x;
    return Math.abs(dx) < 9 ? 0 : (dx > 0 ? 1 : -1);
  }

  /* Across the court. A throw drifts sideways at a steady rate, so it comes back off the front wall at the angle it went in;
     a cortada or costado runs to the side wall first and comes off it across the court. zT is where it first lands.
     A person steers it by holding left or right as they throw; the CPU places it away from the receivers. */
  function latPlan(g, p, f, pr, lat) {
    var s = pr.s, i, tF = 0, mx = -1e9, tB = pr.endT || (s.length ? s[s.length - 1].t : 1), tS = 0.3, z0 = p.z, zT, shot = f.shot | 0;
    for (i = 0; i < s.length; i++) if (s[i].x > mx) { mx = s[i].x; tF = s[i].t; }
    for (i = 0; i < s.length; i++) if (s[i].n >= 1) { tB = s[i].t; break; }
    if (p.human) zT = shot === 2 ? (lat < 0 ? 0.1 : lat > 0 ? 0.34 : 0.2) : shot === 4 ? (lat < 0 ? 0.14 : lat > 0 ? 0.44 : 0.28) : shot >= 2 ? (lat < 0 ? 0.42 : lat > 0 ? 0.88 : 0.66) : (lat < 0 ? 0.2 : lat > 0 ? 0.8 : 0.5);
    else if (shot === 2) zT = 0.08 + 0.24 * Math.random();                       // the cortada dies along the side wall
    else if (shot === 4) zT = 0.16 + 0.24 * Math.random();                       // the costado runs back deep down the side-wall half
    else if (shot >= 2) zT = 0.66 + 0.22 * Math.random();                       // dos paredes angles away across to the open side
    else {
      var rz = 0, rn = 0; g.players.forEach(function (q) { if (q.team !== p.team && !q.out) { rz += q.z; rn++; } }); rz = rn ? rz / rn : 0.5;
      var off = ({ easy: 0.1, normal: 0.24, hard: 0.38 })[g.cfg.level] || 0.24;
      zT = rz + (rz > 0.5 ? -1 : 1) * off * (0.4 + Math.random());
      if (f.serve) zT = 0.35 + 0.3 * Math.random();
    }
    zT = Math.max(0.12, Math.min(0.88, zT));
    if (shot === 2) {                                                            // the cortada meets the wall after the front wall, not before
      for (i = 0; i < s.length; i++) if (s[i].t > tF && s[i].x <= f.sideX) { tS = s[i].t; break; }
      tS = Math.max(0.12, tS);
      return { vz: -z0 / tS, vzOut: 0.12, zT: zT, zF: Math.max(0, z0 * (1 - Math.max(0, tF) / tS)) };
    }
    if (shot >= 2) {
      for (i = 0; i < s.length; i++) if (s[i].x >= f.sideX) { tS = s[i].t; break; }
      return { vz: -z0 / Math.max(0.05, tS), vzOut: zT / Math.max(0.15, tB - tS), zT: zT, zF: zT * Math.max(0, tF - tS) / Math.max(0.15, tB - tS) };
    }
    return { vz: (zT - z0) / Math.max(0.2, tB), vzOut: 0, zT: zT, zF: z0 + (zT - z0) * tF / Math.max(0.2, tB) };
  }

  function doThrow(g, p, deg, hard, lat) {
    deg = Math.max(-12, Math.min(60, deg));
    var serve = g.flags.serve, shot = shotOf(serve, hard), b = launch(p, deg, serve, shot), lv = LV[g.cfg.level];
    g.hard = shot; p.shot = shot; g.reb = false;
    g.ball.x = b.x; g.ball.y = b.y; g.ball.vx = b.vx; g.ball.vy = b.vy;
    g.lastTeam = p.team; g.flags = flagsFor(p, serve, shot);
    g.holder = -1; g.flightT = 0; g.phase = 'rally'; g.rally++;
    g.pred = predict(g.ball, g.flags);
    var lp = latPlan(g, p, g.flags, g.pred, lat || 0); g.ball.z = p.z; g.ball.vz = lp.vz; g.flags.vzOut = lp.vzOut; g.flags.zT = lp.zT;
    if (g.cfg.solo[1 - p.team]) g.act[1 - p.team] = chooseActive(g, 1 - p.team);
    p.cool = 0.4; p.anim = 0.28; p.aim = deg;
    g.players.forEach(function (q) {
      if (q.team !== p.team && !q.human) q.ai = { react: lv.react * (0.7 + Math.random() * 0.6), err: gauss() * lv.err };
    });
    g.events.push('throw');
  }

  function point(g, ev) {
    var w = FAULTS[ev] ? 1 - g.lastTeam : g.lastTeam;
    g.score[w]++; g.pointWinner = w; g.msg = { ev: ev, winner: w }; g.msgT = 2.1; g.phase = 'point';
    if (g.score[w] >= g.cfg.target) g.winner = w;
    g.events.push(g.winner >= 0 ? 'win' : 'point');
  }

  /* inputs[i] = { dir: -1|0|1, throw: bool } for human seats */

button,select,a.btn{font:700 13px system-ui,sans-serif;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 13px;cursor:pointer;text-decoration:none}

#welcome{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 40%,rgba(201,165,92,.18),rgba(5,6,10,.96) 60%);display:flex;align-items:center;justify-content:center;padding:20px}

#welcome img{width:96px}

#welcome h1{margin:0;font:900 40px/1 system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase}
#welcome p{margin:0;color:var(--muted)}

#tour video{width:100%;max-width:1100px;max-height:78vh;border:1px solid var(--gold);border-radius:10px;background:#000}
#welcome button{background:var(--gold);color:#0b0c0f;border:0;font-size:16px;letter-spacing:.14em;text-transform:uppercase;padding:14px 26px}
